:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F5F5F9;--card:#FFFFFF;--ink:#16142A;--ink2:#3D3A55;--muted:#75728A;--line:#E8E7F0;--soft:#F1EDFE;--soft2:#F7F6FB;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0D1A;--card:#18162C;--ink:#F2F1FA;--ink2:#D0CEE4;--muted:#9693B0;--line:#2A2744;--soft:#251F49;--soft2:#1E1B35;--side:#0A0914;--side2:#1D1A36;--greenbg:#0F3527;--redbg:#3A1520;--pinkbg:#3A1427;--amberbg:#382711;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0E0D1A;--card:#18162C;--ink:#F2F1FA;--ink2:#D0CEE4;--muted:#9693B0;--line:#2A2744;--soft:#251F49;--soft2:#1E1B35;--side:#0A0914;--side2:#1D1A36;--greenbg:#0F3527;--redbg:#3A1520;--pinkbg:#3A1427;--amberbg:#382711}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--v);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--v2);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em}
p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#cfcbe3}
.btn-p{background:var(--v);border-color:var(--v);color:#fff}
.btn-p:hover{background:var(--vink);border-color:var(--vink)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:13px 20px;font-size:15px;border-radius:12px}

.btn-danger{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}

.tag-pro{background:var(--soft);color:var(--v);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;outline:none}
.input:focus{border-color:var(--v2);box-shadow:0 0 0 3px var(--soft)}
label.f{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
/* app shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto;z-index:40}

.nav a.on{background:var(--side2);color:#fff}
.nav a .lk{margin-left:auto;opacity:.7}
.upcard{margin-top:auto;border:1px solid rgba(139,102,255,.35);background:linear-gradient(170deg,#241E52,#191637);border-radius:16px;padding:16px;color:#E6E3F7}

.upcard li{display:flex;gap:8px;align-items:center;margin:5px 0}

.main{padding:22px 28px 60px;max-width:1440px;width:100%}
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--soft);border:1px dashed color-mix(in srgb,var(--v) 40%,transparent);color:var(--ink2);border-radius:12px;padding:9px 14px;margin-bottom:20px;font-size:12.5px}
.demobar b{color:var(--v)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--v);color:#fff}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(22,20,42,.3);padding:6px;z-index:50}
.ddm.r{left:auto;right:0}

.ddm button:hover,.ddm a:hover{background:var(--soft2)}
.ddm .sel{background:var(--soft);color:var(--v)}
.ddm hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pbtn{min-width:170px;justify-content:flex-start}
.pbtn .cv{margin-left:auto}
.picon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.picon.ig{background:linear-gradient(135deg,#F9A23A,#E1306C 55%,#7A3BD9)}
.picon.yt{background:var(--yt)}
.picon.all{background:var(--v)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8B66FF,#E1306C);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.menu-t{display:none}
/* page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:26px;font-weight:700}
.ph p{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:500}
/* metric */
.metric{display:flex;gap:14px;align-items:flex-start;padding:18px}
.mic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.t-pink{background:var(--pinkbg);color:var(--pink)} .t-green{background:var(--greenbg);color:var(--green)} .t-rose{background:var(--redbg);color:var(--red)} .t-amber{background:var(--amberbg);color:var(--amber)} .t-violet{background:var(--soft);color:var(--v)} .t-red{background:var(--redbg);color:var(--yt)}
.metric .lab{color:var(--ink2);font-weight:500;font-size:13px}
.metric .val{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.metric .chg{white-space:nowrap;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.metric .chg span.muted{font-weight:500}
.metric .spark{margin-left:auto;width:42%;max-width:130px;height:52px;align-self:center}
.unav{font-size:12px;color:var(--muted);background:var(--soft2);border-radius:8px;padding:6px 8px;margin-top:4px}
/* charts */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.ch-y{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);pointer-events:none}
.ch-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.ch-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);z-index:5}
.ch-tip div{display:flex;gap:6px;align-items:center}
.ch-tip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ch-ln{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:0;pointer-events:none}
.chart.padl{padding-left:42px}
.bars .row{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bars .tr{height:9px;background:var(--soft2);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--v);border-radius:6px}
.heat{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--muted)}
.heat .c{height:22px;border-radius:5px;background:var(--v)}
.heat .h{display:flex;align-items:center}
.heat .d{text-align:center}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.dleg{flex:1;min-width:140px;font-size:13px}
.dleg div{display:flex;align-items:center;gap:8px;margin:7px 0}
.dleg i{width:9px;height:9px;border-radius:3px}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
/* lock */
.lockwrap{position:relative;overflow:hidden;border-radius:12px;min-height:200px}

.lockbox{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(22,20,42,.35);border-radius:14px;padding:16px 18px;text-align:center;max-width:300px}
.lockbox .lki{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--v);display:grid;place-items:center;margin:0 auto 8px}

.lockbox.cmp{padding:12px 14px}.lockbox.cmp h4{font-size:13px;margin-bottom:10px}

/* content */
.tabs{display:inline-flex;gap:4px;background:var(--soft2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--v);box-shadow:0 1px 3px rgba(22,20,42,.08)}
.citem{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.citem:first-child{border-top:0;padding-top:2px}
.citem .ct{flex:1;min-width:0}
.citem .ct h5{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .date{color:var(--muted);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:5px}
.stats span{display:inline-flex;align-items:center;gap:5px}
.thumb{position:relative;width:76px;height:60px;border-radius:10px;overflow:hidden;flex:none;background:linear-gradient(170deg,var(--a),var(--b))}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.thumb .tb{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.45);color:#fff;border-radius:5px;padding:2px 4px;display:flex}
.thumb.sm{width:52px;height:42px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.s{cursor:pointer}
table.t th.s:hover{color:var(--v)}
table.t td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t td.wrap{white-space:normal;min-width:200px}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
/* premium row */
.prem{display:flex;flex-direction:column;gap:10px}
.prem .hd{display:flex;gap:10px;align-items:center}
.prem .hd h4{font-size:14.5px}
.prem>p.muted{min-height:40px}
.mini-rows div{height:10px;border-radius:5px;background:var(--soft2);margin:8px 0}
/* ai */
.ins{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.ins .ii{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.ins p{font-weight:500}
.ins .basis{font-size:12px;color:var(--muted);margin-top:4px}
.sec-t{font-size:15px;font-weight:700;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.score{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.box{background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--v);border-color:var(--v);color:#fff}
.chip.static{cursor:default;font-weight:500}
.idea dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:10px 0 0;font-size:13px}
.idea dt{color:var(--muted);font-weight:600}
.idea dd{margin:0}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(14,12,30,.5);display:grid;place-items:center;padding:20px;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:20px;max-width:460px;width:100%;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:calc(100% - 20px);overflow:auto;animation:pop .18s ease-out}
.modal.wide{max-width:620px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal h2{font-size:21px;margin-bottom:6px}
.modal .x{float:right;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px}
.checks{list-style:none;padding:0;margin:16px 0 20px}
.checks li{display:flex;gap:10px;align-items:center;margin:9px 0;font-weight:500}
.checks .ck{width:22px;height:22px;border-radius:50%;background:var(--greenbg);color:var(--green);display:grid;place-items:center;flex:none}
.spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:200;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:90vw}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--v);display:grid;place-items:center;margin:0 auto 12px}
.empty h4{color:var(--ink);font-size:15px;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}

.price-card{display:flex;flex-direction:column;gap:12px}
.price-card.hl{border:2px solid var(--v)}
.price{font-size:34px;font-weight:800;letter-spacing:-.03em}
.price small{font-size:14px;color:var(--muted);font-weight:500}
.bnav{display:none}
.sidebg{display:none}
/* landing */
.lp{background:var(--card)}
.lp-nav{display:flex;align-items:center;gap:22px;max-width:1180px;margin:0 auto;padding:18px 24px}
.lp-nav .brand{color:var(--ink);padding:0}
.lp-nav .links{display:flex;gap:22px;margin-left:24px}
.lp-nav .links a{color:var(--ink2);font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding:56px 24px 72px}
.hero h1{font-size:clamp(36px,5.2vw,60px);line-height:1.04;letter-spacing:-.04em;font-weight:800;max-width:12ch}
.hero p.lead{font-size:18px;color:var(--ink2);margin:20px 0 28px;max-width:46ch}
.hero .note{font-size:13px;color:var(--muted);margin-top:14px}
.stage{position:relative;background:var(--side);border-radius:24px;padding:22px;box-shadow:0 40px 80px -40px rgba(43,24,120,.6)}
.stage .card{box-shadow:none}

.sect .intro{color:var(--muted);font-size:16px;margin:12px 0 36px;max-width:56ch}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{padding:20px;border-left:2px solid var(--line)}
.step::before{counter-increment:s;content:counter(s);display:block;font-size:13px;font-weight:700;color:var(--v);margin-bottom:12px}
.step h3{font-size:16px;margin-bottom:6px}
.step p{color:var(--muted);font-size:13.5px}
.feat h3{font-size:16px;margin:12px 0 6px}
.feat p{color:var(--muted);font-size:13.5px}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{font-weight:600;cursor:pointer;font-size:15px}
.faq details p{color:var(--ink2);margin-top:8px;max-width:70ch}
.foot{background:var(--side);color:var(--sideink);padding:48px 0 32px}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
.foot h5{color:#fff;margin:0 0 10px;font-size:13px}
.foot a{display:block;color:var(--sideink);margin:6px 0;font-size:13px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.auth .card{width:100%;max-width:440px;padding:30px}
.ob{max-width:760px;margin:0 auto;padding:48px 24px}
.stepper{display:flex;gap:8px;margin-bottom:28px}
.stepper span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stepper span.on{background:var(--v)}
.article{max-width:720px;margin:0 auto;padding:48px 24px 80px}
.article p{font-size:16.5px;line-height:1.75;color:var(--ink2);margin:0 0 18px}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>.span-all{grid-column:1/-1}}
@media (max-width:960px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:270px;height:100%;transform:translateX(-100%);transition:transform .22s ease;padding-top:calc(22px + env(safe-area-inset-top,0px))}
 .side.open{transform:none}
 .sidebg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
 .menu-t{display:grid}
 .top{padding:10px 12px;top:0;gap:6px}
 .top .chv{display:none}
 .pbtn{min-width:0}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .main{padding:16px 14px 100px}
 .g21,.g12,.g2{grid-template-columns:1fr}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border:0;background:transparent;padding:6px 0;font-weight:600;cursor:pointer}
 .bnav .on{color:var(--v)}
 .hero{grid-template-columns:1fr;padding-top:28px}
 .stage .float{position:static;width:auto;margin-top:14px}
 .steps{grid-template-columns:1fr 1fr}
 .lp-nav .links{display:none}
 .foot .cols{grid-template-columns:1fr 1fr}
 .hide-m{display:none!important}
}
@media (max-width:620px){
 .g4,.g3{grid-template-columns:1fr}
 .metric .spark{width:34%}
 .steps{grid-template-columns:1fr}
 .pbtn{min-width:0}
 .ph h1{font-size:22px}
 .idea dl{grid-template-columns:1fr}
 .bars .row{grid-template-columns:80px 1fr 40px}
}

@media print{.side,.top,.bnav,.demobar,.no-print,.sidebg{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}

function loadOnce(key,fn){if(LIVE.pending[key])return;LIVE.pending[key]=fn().then(()=>{}).catch(e=>{LIVE.err=e}).finally(()=>{delete LIVE.pending[key];rerender()})}

const pchg=(a,b)=>a==null||b==null||!b?null:+((a-b)/Math.abs(b)*100).toFixed(1);

  content(range=9999){return(LIVE.media||[]).map(m=>{const d=new Date(m.timestamp);const ago=Math.floor((Date.now()-d)/864e5);const inter=m.interactions??((m.likes||0)+(m.comments||0)+(m.shares||0)+(m.saves||0));return Object.assign({},m,{platform:"instagram",date:d,ago,hour:d.getHours(),change:null,er:m.reach?inter/m.reach*100:null,live:true})}).filter(c=>c.ago<=range)},
  metrics(range){const i=LIVE.ins[range],p=LIVE.profile||{};if(!i)return[];const cur=i.current||{},prev=i.previous||{};

    const all=this.content();const rv=sum(all.filter(c=>c.type==="reel"&&c.ago<=range),c=>c.views||0),prv=sum(all.filter(c=>c.type==="reel"&&c.ago>range&&c.ago<=2*range),c=>c.views||0);

    return[
      {key:"followers",label:"Followers",value:fol,change:fch,icon:"users",tone:"pink",color:"#7C5CFF",unavailable:fol==null?un:null,note:fch==null?"Growth needs 100+ followers":null},
      {key:"reach",label:"Reach",value:cur.reach,change:pchg(cur.reach,prev.reach),icon:"eye",tone:"green",color:"#3B82F6",unavailable:cur.reach==null?un:null,note:range>30?"Sum of 30-day windows":null},
      {key:"engagement",label:"Engagement rate",value:er,change:pchg(er,erp),f:"pct",icon:"heart",tone:"rose",color:"#E1306C",unavailable:er==null?un:null},
      {key:"reelsViews",label:"Reels views",value:rv,change:prv?pchg(rv,prv):null,icon:"play",tone:"amber",color:"#F59E0B",note:"From your latest 30 posts"}]},
  series(key,range){const i=LIVE.ins[range];if(!i)return null;const lab=v=>dshort(new Date(v.date));
    if(key==="reach"&&i.reachDaily&&i.reachDaily.length>1)return{name:"Reach (daily)",color:"#3B82F6",values:i.reachDaily.map(v=>v.value),labels:i.reachDaily.map(lab)};
    if(key==="followers"&&i.followerDaily&&i.followerDaily.length>1&&LIVE.profile&&LIVE.profile.followers_count!=null){let run=LIVE.profile.followers_count;const arr=[];for(let k=i.followerDaily.length-1;k>=0;k--){arr.unshift(run);run-=i.followerDaily[k].value}return{name:"Followers",color:"#7C5CFF",values:arr,labels:i.followerDaily.map(lab)}}
    return null},
  audience(){const a=LIVE.aud;if(!a)return null;let cn=null;try{cn=new Intl.DisplayNames(["en"],{type:"region"})}catch(e){}
    const top=(arr,n,map)=>arr?arr.slice(0,n).map(x=>[map?map(x[0]):x[0],x[1]]):null;
    return{age:top(a.age,6),gender:top(a.gender,3,g=>({F:"Women",M:"Men",U:"Not specified"})[g]||g),countries:top(a.country,6,c=>{try{return cn?cn.of(c):c}catch(e){return c}}),cities:top(a.city,5,c=>String(c).split(",")[0]),hours:a.hours,heat:null,live:true}}
};

const Unav=t=>`<div class="unav" style="font-size:13px;padding:12px">${I("info",15)} Unavailable. ${t}</div>`;

function hourBars(h){const slots=["12–3 AM","3–6 AM","6–9 AM","9 AM–12","12–3 PM","3–6 PM","6–9 PM","9 PM–12"].map((l,i)=>[l,h.slice(i*3,i*3+3).reduce((a,b)=>a+b,0)]);const mx=Math.max(...slots.map(x=>x[1]))||1;return bars(slots.map(x=>[x[0],Math.round(x[1]/mx*100)]))+'<p class="muted" style="font-size:12px;margin-top:8px">Followers online by time of day, as % of the busiest slot (your local time may differ)</p>'}

function ErrorState(e){const c=e.code||"";const m=({NOT_CONNECTED:["Instagram isn’t connected","Connect your account to load your analytics.","Connect Instagram","connect"],TOKEN_EXPIRED:["Your Instagram connection expired","Reconnect to keep your analytics up to date.","Reconnect Instagram","reconnect"],PERMISSION_MISSING:["Insights permission is missing","Reconnect and approve every requested permission. Instagram only shares insights for Business and Creator accounts.","Reconnect Instagram","reconnect"],RATE_LIMITED:["Instagram is limiting requests","Wait a few minutes, then try again.","Try again","retry"],NOT_CONFIGURED:["Instagram isn’t set up on the server","Add the app ID, secret and redirect URI in Netlify, then redeploy.","Try again","retry"]})[c]||["Couldn’t load Instagram data",e.message||"Try again in a moment.","Try again","retry"];

/* ================= insights engine (rule-based in demo; /services/ai/coach in prod) =================
   Every statement is computed from DataService output and carries its basis. */
function buildInsights(){
  const out={summary:[],working:[],improve:[],next:[],growth:[]};
  if(S.connected.instagram){
    const ig=DataService.content("instagram");const reels=ig.filter(c=>c.type==="reel"),posts=ig.filter(c=>c.type==="post"),stories=ig.filter(c=>c.type==="story");
    const m=DataService.metrics("instagram",S.range);const fm=m.find(x=>x.key==="followers"),rm=m.find(x=>x.key==="reach");
    if(fm&&fm.value!=null)out.summary.push({t:`You have ${fmt(fm.value)} Instagram followers${fm.change!=null?`, ${fm.change>=0?"up":"down"} ${Math.abs(fm.change)}% in this period`:""}.${rm&&rm.change!=null?` Reach is ${rm.change>=0?"up":"down"} ${Math.abs(rm.change)}% on the previous period.`:""}`,b:`${rangeLabel()}, account totals`,i:"trend",tone:"t-violet"});
    const erOf=a=>avg(a.filter(c=>c.er!=null),c=>c.er);
    if(reels.length&&posts.length)out.working.push({t:`Reels average ${fmt(avg(reels,vw))} views and ${pct(erOf(reels))} engagement. Posts average ${fmt(avg(posts,vw))} and ${pct(erOf(posts))}.`,b:`${reels.length} Reels vs ${posts.length} posts`,i:"play",tone:"t-amber"});
    const top3=[...ig].sort((a,b)=>vw(b)-vw(a)).slice(0,3);
    if(top3.length>=3){const h=top3.map(c=>c.hour);out.working.push({t:`Your 3 most-viewed posts went live between ${Math.min(...h)}:00 and ${Math.max(...h)+1}:00. Worth testing that window on purpose.`,b:`Publish times of your top 3 posts (a pattern, not proof of cause)`,i:"clock",tone:"t-green"})}
    const sr=a=>avg(a.filter(c=>c.saves!=null&&vw(c)>0),c=>c.saves/vw(c)*100);const saveP=sr(posts),saveR=sr(reels);
    const ts=[...ig].filter(c=>c.saves!=null).sort((a,b)=>b.saves-a.saves)[0];
    if(saveP&&saveR&&ts)out.working.push({t:saveP>=saveR?`Posts earn ${(saveP/saveR).toFixed(1)}× more saves per view than Reels. “${ts.title}” leads with ${fmt(ts.saves)} saves.`:`Reels earn ${(saveR/saveP).toFixed(1)}× more saves per view than posts. “${ts.title}” leads with ${fmt(ts.saves)} saves.`,b:`Saves ÷ views across ${posts.length+reels.length} feed items`,i:"bookmark",tone:"t-violet"});
    const tv=sum(ig,vw);if(tv&&ig.length){const comRate=sum(ig,c=>c.comments||0)/tv*1000;out.improve.push({t:`You get ${comRate.toFixed(1)} comments per 1,000 views. Ending captions with one direct question is an easy test.`,b:`${ig.length} items, comments ÷ views`,i:"comment",tone:"t-rose"})}
    if(stories.length&&fm&&fm.value)out.improve.push({t:`Stories reach about ${fmt(avg(stories,vw))} people each, roughly ${(avg(stories,vw)/fm.value*100).toFixed(0)}% of your followers.`,b:`${stories.length} Stories in the period`,i:"eye",tone:"t-rose"});
    const neg=ig.filter(c=>c.change!=null&&c.change<0);if(neg.length)out.improve.push({t:`${neg.length} posts performed below your average: ${neg.map(c=>`“${c.title}”`).join(", ")}.`,b:`Change vs your 90-day average per post`,i:"down",tone:"t-rose"});
    if(top3.length)out.next.push({t:`A ${top3[0].type==="reel"?"Reel":"post"} on the same theme as “${top3[0].title}”, your most-viewed piece, published around ${top3[0].hour}:00.`,b:`Top post by views`,i:"spark",tone:"t-violet"});
    if(ts&&ts.saves)out.next.push({t:`A carousel checklist on the topic of “${ts.title}”. That’s what your audience saves most.`,b:`Most-saved post`,i:"grid",tone:"t-violet"});
    const per=ig.filter(c=>c.ago<=28&&c.type!=="story").length/4;if(ig.length)out.growth.push({t:`You published ${per.toFixed(1)} feed posts per week in the last 28 days. A steady rhythm makes it easier to see which changes work.`,b:`Feed posts, last 28 days`,i:"cal",tone:"t-green"});
    if(!ig.length)out.summary.push({t:`No posts found on this account yet. Publish a few, then check back for recommendations.`,b:`Your media list`,i:"info",tone:"t-violet"});
  }
  if(S.connected.youtube){
    const yt=DataService.content("youtube");const sh=yt.filter(c=>c.type==="short"),lg=yt.filter(c=>c.type==="long");
    out.working.push({t:`Shorts average ${fmt(avg(sh,c=>c.views))} views, compared with ${fmt(avg(lg,c=>c.views))} for long-form videos.`,b:`${sh.length} Shorts vs ${lg.length} long-form videos`,i:"yt",tone:"t-amber"});
    const lw=sum(lg,c=>c.watch)/sum(yt,c=>c.watch)*100;
    out.growth.push({t:`Long-form produced ${lw.toFixed(0)}% of your watch time from ${(lg.length/yt.length*100).toFixed(0)}% of uploads. Shorts bring reach; long-form keeps viewers.`,b:`Watch hours by format`,i:"clock",tone:"t-green"});
    out.next.push({t:`A long-form follow-up to "${sh.sort((a,b)=>b.views-a.views)[0].title}". Your most-viewed Short can point viewers to it.`,b:`Top Short by views`,i:"play",tone:"t-violet"});
  }
  if(both())out.growth.push({t:`Spiti content performs on both platforms. Re-cutting your top YouTube video into 2–3 Reels uses material you already have.`,b:`Top items on each platform share the same location`,i:"layers",tone:"t-green"});
  return out;
}

/* ================= charts ================= */
let CH={},chN=0;
function lineChart(series,{h=230,area=true,norm=null}={}){
  const id="ch"+(++chN);CH[id]=series;const n=series[0].values.length;const normalize=norm===null?series.length>1:norm;
  let gmin=Infinity,gmax=-Infinity;series.forEach(s=>s.values.forEach(v=>{gmin=Math.min(gmin,v);gmax=Math.max(gmax,v)}));
  const pad=(gmax-gmin)*.12||1;const lo=Math.max(0,gmin-pad),hi=gmax+pad;
  const paths=series.map((s,si)=>{let mn=lo,mx=hi;if(normalize){mn=Math.min(...s.values);mx=Math.max(...s.values);const p=(mx-mn)*.15||1;mn-=p;mx+=p}
    const pts=s.values.map((v,i)=>[n>1?i/(n-1)*100:50,100-(v-mn)/(mx-mn||1)*100]);
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
    const gid=id+"g"+si;
    return(area&&si===0?`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L100 100 L0 100Z" fill="url(#${gid})"/>`:"")+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}).join("");
  const grid=[0,25,50,75,100].map(y=>`<line x1="0" x2="100" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
  const labs=series[0].labels;const k=Math.min(6,n);const xl=Array.from({length:k},(_,i)=>labs[Math.round(i*(n-1)/(Math.max(1,k-1)))]);
  const yl=normalize?"":`<div class="ch-y">${[hi,hi-(hi-lo)*.25,hi-(hi-lo)*.5,hi-(hi-lo)*.75,lo].map(v=>`<span>${fmtV(v,series[0].f)}</span>`).join("")}</div>`;
  const legend=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
  return`${legend}<div style="position:relative">${yl}<div class="chart ${normalize?"":"padl"}" data-chart="${id}" style="height:${h}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="${esc(series.map(s=>s.name).join(", "))} over time">${grid}${paths}</svg><div class="ch-ln"></div><div class="ch-tip"></div></div></div><div class="ch-x" style="${normalize?"":"padding-left:42px"}">${xl.map(l=>`<span>${l}</span>`).join("")}</div>`;
}
function spark(vals,color){const mn=Math.min(...vals),mx=Math.max(...vals),n=vals.length;const pts=vals.map((v,i)=>[(i/(n-1)*100).toFixed(1),(92-(v-mn)/(mx-mn||1)*80).toFixed(1)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");const g="sp"+(++chN);
  return`<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L100 100 L0 100Z" fill="url(#${g})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function donut(segs){let off=25;const cols=["#7C5CFF","#3B82F6","#E1306C","#F59E0B","#0E9A66","#A5A2BD"];
  const arcs=segs.map((s,i)=>{const a=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${cols[i%cols.length]}" stroke-width="6" stroke-dasharray="${s[1]} ${100-s[1]}" stroke-dashoffset="${off}"/>`;off-=s[1];return a}).join("");
  return`<div class="donut-wrap"><svg viewBox="0 0 42 42" role="img" aria-label="Distribution chart">${arcs}</svg><div class="dleg">${segs.map((s,i)=>`<div><i style="background:${cols[i%cols.length]}"></i>${s[0]}<b>${s[1]}%</b></div>`).join("")}</div></div>`}
function bars(rows,suffix="%",color){const mx=Math.max(...rows.map(r=>r[1]));return`<div class="bars">${rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><div class="tr"><div class="fill" style="width:${r[1]/mx*100}%;${color?"background:"+color:""}"></div></div><b style="text-align:right">${typeof r[1]==="number"&&suffix==="%"?r[1]+"%":esc(r[2]||r[1])}</b></div>`).join("")}</div>`}
function heatmap(h){const hrs=["12 AM","3 AM","6 AM","9 AM","12 PM","3 PM","6 PM","9 PM"];const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  return`<div class="heat">${h.map((row,i)=>`<div class="h">${hrs[i]}</div>${row.map(v=>`<div class="c" style="opacity:${(.08+v*.92).toFixed(2)}" title="${(v*100).toFixed(0)}% of peak"></div>`).join("")}`).join("")}<div></div>${days.map(d=>`<div class="d">${d}</div>`).join("")}</div>`}
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".chart");document.querySelectorAll(".chart.act").forEach(x=>{if(x!==c){x.classList.remove("act");x.querySelector(".ch-tip").style.opacity=0;x.querySelector(".ch-ln").style.opacity=0}});if(!c)return;const s=CH[c.dataset.chart];if(!s)return;
  const r=c.getBoundingClientRect(),padL=c.classList.contains("padl")?42:0;const w=r.width-padL;const x=Math.max(0,Math.min(w,e.clientX-r.left-padL));const n=s[0].values.length;const i=Math.round(x/w*(n-1));const px=padL+(n>1?i/(n-1)*w:w/2);
  const tip=c.querySelector(".ch-tip"),ln=c.querySelector(".ch-ln");c.classList.add("act");tip.innerHTML=`<b>${s[0].labels[i]}</b>`+s.map(se=>`<div><i style="background:${se.color}"></i>${esc(se.name)}: ${fmtV(se.values[i],se.f)}</div>`).join("");tip.style.left=Math.max(70,Math.min(r.width-70,px))+"px";tip.style.top="30px";tip.style.opacity=1;ln.style.left=px+"px";ln.style.opacity=1});

function analyzeCaption(text,tone){
  const lines=text.trim().split(/\n+/);const first=lines[0]||"";const words=text.trim().split(/\s+/).filter(Boolean);const tags=(text.match(/#\w+/g)||[]);
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim());const avgS=words.length/(sentences.length||1);
  const hasCTA=/(comment|save|share|follow|link in bio|tag|subscribe|dm|tell me|let me know|\?)/i.test(text);
  const hook=Math.min(100,40+(first.length<70?20:0)+(/\d/.test(first)?15:0)+(/\?|!/.test(first)?15:0)+(/(you|your)/i.test(first)?10:0));
  const clarity=Math.max(30,Math.min(100,110-avgS*3));const length=words.length<8?40:words.length<=120?90:words.length<=200?70:45;
  const cta=hasCTA?85:30;const eng=Math.round((hook+clarity+length+cta)/4);
  const toneD=/!|🔥|😍|✨/.test(text)?"Energetic":/(I |my |me )/.test(text)?"Personal":"Informative";
  const stop=new Set("about above after again their there these those which while would could should with from that this have your what when where into just like more most very really spent morning every minute worth still looked think thing things today going getting today something always never because being other".split(" "));
  const kws=[...new Set(words.map(w=>w.toLowerCase().replace(/[^a-z]/g,"")).filter(w=>w.length>4&&!stop.has(w)))].slice(0,4);
  const proper=[...text.matchAll(/(?:^|[^.!?\n]\s)([A-Z][a-z]{3,})/g)].map(m=>m[1]).filter(w=>!stop.has(w.toLowerCase()));
  const topic=proper[0]||kws.find(w=>!/(ed|ing|ly)$/.test(w))||"this";
  kws.sort((x,y)=>(proper.map(q=>q.toLowerCase()).includes(y)?1:0)-(proper.map(q=>q.toLowerCase()).includes(x)?1:0));
  const hooks=[`Nobody tells you this about ${topic}.`,`I almost skipped ${topic}. Glad I didn’t.`,`3 things I wish I knew before ${topic}.`,`Save this if ${topic} is on your list.`];
  const ctas=["Would you go? Tell me in the comments.","Save this for your next trip.","Send this to the friend you’d go with."];
  const toneHook={Friendly:hooks[1],Bold:hooks[0],Professional:hooks[2]}[tone]||hooks[0];
  const body=sentences.slice(0,2).map(s=>s.trim()).join(". ")+".";
  const hashtags=[...new Set([...proper.map(k=>"#"+k.toLowerCase()),...kws.filter(w=>!/(ed|ing|ly)$/.test(w)).map(k=>"#"+k),"#travelreels","#creatortips"])].slice(0,6);
  const improved=`${toneHook}\n\n${body}\n\n${hasCTA?ctas[0]:ctas[0]}\n\n${hashtags.join(" ")}`;
  const notes={Hook:hook>=75?"Strong opener.":"Open with a number, a question or ‘you’ in the first line.",Clarity:clarity>=75?"Easy to read.":"Shorten long sentences.",Length:length>=80?"Good length for Instagram.":words.length<8?"Too short to give context.":"Long. Move detail into a carousel or comment.",CTA:hasCTA?"Has a clear call to action.":"No call to action. Ask for a comment or save.","Engagement potential":eng>=75?"Likely to perform above your average.":"Room to improve.",Tone:toneD};
  return{scores:[["Hook",hook],["Clarity",Math.round(clarity)],["Length",length],["CTA",cta],["Engagement potential",eng]],tone:toneD,notes,improved,hooks,ctas,hashtags,tags:tags.length};
}

  return`<div style="min-height:100vh;background:var(--bg)"><div class="ob"><a class="brand" href="#/" style="color:var(--ink);padding:0 0 28px">${LOGO}Nexlytics</a><div class="stepper"><span class="on"></span><span class="${any?"on":""}"></span><span></span></div>
  <h1 style="font-size:30px;letter-spacing:-.03em">Welcome${S.user.name?", "+esc(S.user.name):""}</h1><p class="muted" style="font-size:16px;margin:8px 0 28px">Connect your social accounts to start analyzing your performance.</p>
  ${["instagram","youtube"].map(p=>{const c=S.connected[p],pr=DataService.profile(p);return`<div class="card" style="margin-bottom:14px"><div class="acc">${pIcon(p,48)}<div class="meta">${c?`<b>${p==="instagram"?(pr.handle?"@"+esc(pr.handle):"Instagram"):esc(pr.name)}</b><div class="muted" style="font-size:13px">${p==="instagram"&&isLiveIG()&&pr.followers==null?"Loading details on your dashboard":p==="instagram"?fmt(pr.followers)+" followers":fmt(pr.subscribers)+" subscribers"}</div><span class="stat-ok">Connected</span>`:`<b>${P_NAME[p]}</b><div class="muted" style="font-size:13px">${p==="instagram"?"Business or Creator account required":"Any channel you manage"}</div>`}</div>${c?`<button class="btn btn-sm btn-danger" data-act="disconnect" data-v="${p}">Disconnect</button>`:`<button class="btn btn-p" data-act="connect" data-v="${p}">Connect ${P_NAME[p]}</button>`}</div></div>`}).join("")}
  <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;align-items:center"><a class="btn btn-p btn-lg ${any?"":"no"}" href="#/app/dashboard" ${any?"":'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>Continue to dashboard</a><span class="muted" style="font-size:13px">You can connect one or both, and add the other later.</span></div></div></div>`}

/* ================= modals ================= */
function openModal(html,wide){document.getElementById("modal").innerHTML=`<div class="mbg" data-act="bgclose"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector(".modal button, .modal input");f&&f.focus()}
function closeModal(){document.getElementById("modal").innerHTML=""}
const UPG={growth:"See day-by-day followers, reach and engagement.",audience:"Know who your audience is and when they’re online.",history:"Go back up to 12 months instead of 28 days.",competitors:"See how you compare with creators in your niche.",reports:"Export polished PDF and CSV reports.",coach:"Get clear next steps from your own data.",ideas:"Never run out of ideas that fit your account.",caption:"You’ve used your 3 free AI captions this month.",account:"Connect more than one account per platform."};
function upgradeModal(reason){openModal(`<button class="x" data-act="close" aria-label="Close">${I("x")}</button><div class="mic t-violet" style="margin-bottom:14px">${I("crown",22)}</div><h2>Unlock deeper insights</h2><p class="muted">${UPG[reason]||"See exactly what is driving your growth."}</p><ul class="checks">${["Advanced analytics & 12-month history","AI Coach","Competitor analysis","Content ideas","PDF & CSV reports"].map(x=>`<li><span class="ck">${I("check",13)}</span>${x}</li>`).join("")}</ul><button class="btn btn-p btn-lg" style="width:100%" data-act="checkout">Upgrade to Pro · ${PRICES[S.currency].sym}${PRICES[S.currency].m}/month</button><button class="btn btn-ghost" style="width:100%;margin-top:8px" data-act="close">Maybe later</button>`)}
function checkoutModal(){const P=PRICES[S.currency];const y=S.cycle==="yearly";const price=y?P.y:P.m;
  openModal(`<button class="x" data-act="close" aria-label="Close">${I("x")}</button><h2>Start your Pro trial</h2><p class="muted">7 days free, then ${P.sym}${price} per ${y?"year":"month"}. Cancel anytime.</p>
  <div style="margin:18px 0"><div class="seg" style="margin-bottom:10px"><button class="${y?"":"on"}" data-act="cycle" data-v="monthly" data-m="1">Monthly</button><button class="${y?"on":""}" data-act="cycle" data-v="yearly" data-m="1">Yearly</button></div> <div class="seg">${Object.keys(PRICES).map(c=>`<button class="${S.currency===c?"on":""}" data-act="currency" data-v="${c}" data-m="1">${c}</button>`).join("")}</div></div>
  <div class="box" style="white-space:normal"><div style="display:flex;justify-content:space-between"><span>Nexlytics Pro ${y?"Yearly":"Monthly"}</span><b>${P.sym}${price.toFixed(2)}</b></div><div style="display:flex;justify-content:space-between" class="muted"><span>Due today</span><span>${P.sym}0.00</span></div></div>
  <p class="muted" style="font-size:12px;margin:12px 0 18px">Demo checkout: no payment is taken. In production this opens Stripe Checkout, and Pro is unlocked only after Stripe confirms the subscription by webhook.</p>
  <button class="btn btn-p btn-lg" style="width:100%" data-act="confirmcheckout">Start free trial</button>`)}
function oauthModal(p){const ig=p==="instagram";openModal(`<button class="x" data-act="close" aria-label="Close">${I("x")}</button><div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">${pIcon(p,40)}<span class="muted">→</span><span class="avatar" style="border-radius:12px;background:var(--v)">${I("trend",18)}</span></div><h2>Connect ${P_NAME[p]}</h2><p class="muted">You’ll sign in with ${ig?"Instagram":"Google"} and approve read-only access.</p>
  <ul class="checks">${(ig?["Read your profile and follower count","Read insights for your posts, Reels and Stories","Read audience demographics (100+ followers)"]:["Read your channel details","Read YouTube Analytics reports","Read your video list"]).map(x=>`<li><span class="ck">${I("check",13)}</span>${x}</li>`).join("")}</ul>
  <p class="muted" style="font-size:12px;margin-bottom:16px">Demo mode: this simulates the OAuth flow and connects a sample account. With credentials configured, this button redirects to ${ig?"Instagram":"Google"} sign-in.</p><button class="btn btn-p btn-lg" style="width:100%" data-act="doconnect" data-v="${p}">Continue</button>`)}

/* ================= router ================= */
function render(){CH={};chN=0;validPlatform();const hh=(location.hash||"#/").slice(1);const [h,hq]=hh.split("?");if(hq)handleHashQuery(hq,h);const parts=h.split("/").filter(Boolean);const root=document.getElementById("root");let html="",title="Nexlytics";
  if(!parts.length){html=asDemo(Landing)}
  else if(parts[0]==="blog"){html=Blog(parts[1]);title=parts[1]?(ARTICLES.find(a=>a.slug===parts[1])||{}).title||"Blog":"Blog"}
  else if(parts[0]==="signup"||parts[0]==="login"){html=Auth(parts[0]);title=parts[0]==="signup"?"Create account":"Sign in"}
  else if(parts[0]==="onboarding"){if(!S.authed){location.hash="#/signup";return}html=Onboarding();title="Connect accounts"}
  else if(parts[0]==="admin"){html=Admin();title="Admin"}
  else if(parts[0]==="app"){if(!S.authed){location.hash="#/signup";return}if(!S.connected.instagram&&!S.connected.youtube){location.hash="#/onboarding";return}
    const pg=parts[1]||"dashboard";const map={dashboard:()=>S.platform==="all"?DashAll():S.platform==="youtube"?DashYT():DashIG(),analytics:Analytics,content:Content,audience:Audience,coach:Coach,caption:Caption,competitors:Competitors,reports:Reports,ideas:Ideas,saved:Saved,settings:Settings};
    let body;if(isLiveIG()&&LIVE.err)body=ErrorState(LIVE.err);else if(isLiveIG()&&needIG())body=`<div class="card">${Loading()}</div>`;else body=(map[pg]||map.dashboard)();
    html=Shell(pg,body);title=(NAV.find(n=>n[0]===pg)||NAV[0])[1]}
  else html=asDemo(Landing);
  root.innerHTML=html;document.title=title+(title==="Nexlytics"?" — Instagram & YouTube analytics with AI insights":" · Nexlytics");
}
function handleHashQuery(q,path){const p=new URLSearchParams(q);const err=p.get("ig_error");
  if(p.get("ig")==="connected")setTimeout(()=>toast("Instagram connected. Loading your data…"),50);
  if(err){const M={not_configured:"Instagram isn’t configured on the server yet.",access_denied:"Instagram access was cancelled.",user_denied:"Instagram access was cancelled.",state_mismatch:"Sign-in expired. Try connecting again.",token_exchange:"Instagram didn’t accept the sign-in. Check the app ID, secret and redirect URI.",missing_code:"Instagram didn’t return a sign-in code. Try again."};setTimeout(()=>toast(M[err]||("Couldn’t connect Instagram ("+err+").")),50)}
  try{history.replaceState(null,"","#"+path)}catch(e){}lastHash="#"+path}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{ui.dd=null;ui.sideOpen=false;if(location.hash!==lastHash){lastHash=location.hash;render();window.scrollTo(0,0)}});

/* ================= actions ================= */
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.actChange==="substatus"){S.subStatus=t.value;save();toast("Subscription state: "+t.value.replace("_"," "));rerender()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("modal").innerHTML)closeModal();else if(ui.dd){ui.dd=null;rerender()}}});
document.addEventListener("click",e=>{
  const sc=e.target.closest("[data-scroll]");if(sc){e.preventDefault();const go=()=>{const el=document.getElementById(sc.dataset.scroll);el&&el.scrollIntoView({behavior:"smooth"})};if(location.hash.length>2){location.hash="#/";setTimeout(go,50)}else go();return}
  const t=e.target.closest("[data-act]");
  if(!t){if(ui.dd&&!e.target.closest(".ddm")){ui.dd=null;rerender()}return}
  const a=t.dataset.act,v=t.dataset.v;
  if(a==="bgclose"){if(e.target===t)closeModal();return}
  if(t.tagName==="BUTTON"||a!=="settab")e.preventDefault&&t.tagName==="BUTTON"&&e.preventDefault();
  switch(a){
    case"dd":ui.dd=ui.dd===v?null:v;if(v==="notif"){S.notifRead=true;save()}rerender();break;
    case"side":ui.sideOpen=!ui.sideOpen;rerender();break;
    case"plat":S.platform=v;ui.dd=null;save();if(!location.hash.includes("/app/dashboard"))location.hash="#/app/dashboard";else rerender();break;
    case"range":S.range=+v;ui.dd=null;save();rerender();break;
    case"upgrade":ui.dd=null;rerender();upgradeModal(v);break;
    case"checkout":checkoutModal();break;
    case"confirmcheckout":S.subStatus="trial";save();closeModal();toast("Pro trial started. All features unlocked.");rerender();break;
    case"cycle":S.cycle=v;save();if(t.dataset.m)checkoutModal();else rerender();break;
    case"currency":S.currency=v;save();if(t.dataset.m)checkoutModal();else rerender();break;
    case"switchcycle":S.cycle=S.cycle==="monthly"?"yearly":"monthly";save();toast("Switched to "+S.cycle+" billing from your next renewal.");rerender();break;
    case"cancel":openModal(`<h2>Cancel Pro?</h2><p class="muted" style="margin-bottom:18px">You’ll keep Pro until the end of this billing period. After that, AI Coach, competitor tracking, reports and history beyond 28 days will lock. Your data stays.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-act="close">Keep Pro</button><button class="btn btn-danger" data-act="confirmcancel">Cancel subscription</button></div>`);break;
    case"confirmcancel":S.subStatus="cancelled";save();closeModal();toast("Subscription cancelled.");rerender();break;
    case"portal":toast("In production this opens the Stripe billing portal.");break;
    case"preview":S.subStatus=v==="pro"?"active":"free";save();rerender();break;
    case"close":closeModal();break;
    case"connect":ui.dd=null;
      if(LIVE.configured&&!S.demoMode){if(v==="instagram"){location.href="/api/oauth/instagram/start";break}
        openModal(`<button class="x" data-act="close" aria-label="Close">${I("x")}</button><div class="mic t-red" style="margin-bottom:14px">${I("yt",22)}</div><h2>YouTube is coming next</h2><p class="muted" style="margin-bottom:18px">Live Instagram is ready. The YouTube connection is the next phase. You can explore the YouTube dashboard in the demo meanwhile.</p><button class="btn btn-p" style="width:100%" data-act="close">OK</button>`);break}
      if(S.connected[v]&&!isPro()){upgradeModal("account");break}oauthModal(v);break;
    case"doconnect":S.connected[v]=true;if(both()&&S.platform!=="all")S.platform="all";else S.platform=v;save();closeModal();toast(P_NAME[v]+" connected.");rerender();break;
    case"disconnect":openModal(`<h2>Disconnect ${P_NAME[v]}?</h2><p class="muted" style="margin-bottom:18px">Nexlytics will stop syncing this account and delete its access token. Past reports you exported aren’t affected.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-act="close">Keep connected</button><button class="btn btn-danger" data-act="dodisconnect" data-v="${v}">Disconnect</button></div>`);break;
    case"dodisconnect":if(v==="instagram"&&isLiveIG()){closeModal();api("/api/instagram/disconnect",{method:"POST"}).then(()=>{S.liveIG=false;S.connected.instagram=false;resetLive();save();toast("Instagram disconnected. Your token was deleted.");if(!S.connected.youtube)location.hash="#/onboarding";else rerender()}).catch(e=>toast("Couldn’t disconnect: "+e.message));break}
      S.connected[v]=false;save();closeModal();toast(P_NAME[v]+" disconnected.");if(!S.connected.instagram&&!S.connected.youtube)location.hash="#/onboarding";else rerender();break;
    case"reconnect":if(v==="instagram"&&LIVE.configured&&!S.demoMode){location.href="/api/oauth/instagram/start";break}oauthModal(v);break;
    case"retry":LIVE.err=null;rerender();break;
    case"exitdemo":S.demoMode=false;S.connected={instagram:S.liveIG,youtube:false};resetLive();save();location.hash=S.liveIG?"#/app/dashboard":"#/onboarding";if(location.hash===lastHash)rerender();break;
    case"ctab":ui[t.dataset.k]=v;rerender();break;
    case"cplat":ui.cPlat=v;if(t.tagName==="BUTTON")rerender();break;
    case"antab":ui.anTab=v;rerender();break;
    case"settab":ui.setTab=v;ui.dd=null;if(location.hash==="#/app/settings")rerender();break;
    case"sort":if(!isPro()){upgradeModal("growth");break}ui.sortDir=ui.sort===v?-ui.sortDir:-1;ui.sort=v;rerender();break;
    case"caption":{const txt=document.getElementById("cap").value.trim();if(txt.length<10){toast("Paste a caption of at least 10 characters.");break}if(!isPro()&&S.aiUsed>=LIMITS.free.aiGenerationsPerMonth){upgradeModal("caption");break}
      ui.captionText=txt;const r=analyzeCaption(txt,document.getElementById("tone").value);r.original=txt;ui.caption=r;if(!isPro()){S.aiUsed++;save()}rerender();break}
    case"copy":{const el=document.getElementById(v);navigator.clipboard&&navigator.clipboard.writeText(el.textContent).then(()=>toast("Copied."),()=>toast("Couldn’t copy. Select the text instead."));break}
    case"niche":ui.niche=v;ui.ideas=null;rerender();break;
    case"saveidea":{const d=(ui.ideas||genIdeas(ui.niche))[+v];if(!S.saved.find(x=>x.hook===d.hook)){S.saved.unshift(d);save();toast("Saved.")}else toast("Already saved.");break}
    case"unsave":S.saved.splice(+v,1);save();rerender();break;
    case"addcomp":{const h=document.getElementById("chandle").value.trim();const p=document.getElementById("cplat").value;if(!/^@?[A-Za-z0-9._ ]{2,40}$/.test(h)){toast("Enter a valid username or channel name.");break}if(S.competitors.length>=LIMITS.pro.competitors){toast("You can track up to 2 competitors. Remove one first.");break}const hh=p==="instagram"?"@"+h.replace(/^@/,""):h;if(S.competitors.find(c=>c.handle.toLowerCase()===hh.toLowerCase())){toast("Already added.");break}S.competitors.push({handle:hh,platform:p});save();rerender();break}
    case"rmcomp":S.competitors=S.competitors.filter(c=>c.handle!==v);save();rerender();break;
    case"regen":if(isLiveIG()){resetLive();rerender()}toast("Insights refreshed from the latest sync.");break;
    case"csv":{const csv=reportData().map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");navigator.clipboard&&navigator.clipboard.writeText(csv).then(()=>toast("CSV copied. Paste it into Excel or Sheets."),()=>toast("Couldn’t access the clipboard."));break}
    case"print":try{window.print()}catch(err){toast("Printing isn’t available here. Use your browser’s print menu.")}break;
    case"saveprofile":{const n=document.getElementById("pn").value.trim(),em=document.getElementById("pe").value.trim(),r=document.getElementById("pr").value;if(!n){toast("Enter your name.");break}if(!/^\S+@\S+\.\S+$/.test(em)){toast("Enter a valid email address.");break}S.user={name:n,email:em};S.region=r;S.currency=REGIONS.find(x=>x[0]===r)[2];save();toast("Changes saved.");rerender();break}
    case"theme":if(v==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;store.set("theme",v);rerender();break;
    case"auth":{if(v==="email"){const em=document.getElementById("ae").value.trim(),pw=document.getElementById("ap").value,nm=document.getElementById("an");const err=document.getElementById("aerr");if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent="Enter a valid email address.";break}if(pw.length<8){err.textContent="Password must be at least 8 characters.";break}S.user={name:(nm&&nm.value.trim())||S.user.name,email:em}}S.authed=true;save();location.hash=(S.connected.instagram||S.connected.youtube)?"#/app/dashboard":"#/onboarding";break}
    case"logout":S.authed=false;ui.dd=null;save();location.hash="#/";break;
    case"demo":e.preventDefault();Object.assign(S,{authed:true,demoMode:true,connected:{instagram:true,youtube:true},platform:"instagram",subStatus:"free",range:28});save();location.hash="#/app/dashboard";toast("Demo account loaded. Use Preview as Free / Pro to compare.");break;
  }
});
(function(){const th=store.get("theme","system");if(th!=="system")document.documentElement.dataset.theme=th})();
async function boot(){
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),5000);const st=await api("/api/instagram/status",{signal:ctl.signal});clearTimeout(to);
    LIVE.available=true;LIVE.configured=!!st.configured;
    if(!S.demoMode&&!S.liveIG&&(S.connected.instagram||S.connected.youtube))S.demoMode=true; // older sessions were demo
    if(st.connected){S.liveIG=true;S.authed=true;if(!S.demoMode)S.connected={instagram:true,youtube:false}}
    else{if(S.liveIG&&!S.demoMode)S.connected.instagram=false;S.liveIG=false}
    save()}catch(e){LIVE.available=false}
  render()}
boot();
</script>
</body>
